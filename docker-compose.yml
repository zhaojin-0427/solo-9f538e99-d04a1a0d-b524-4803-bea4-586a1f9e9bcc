services:
  catalog-review:
    build: .
    image: catalog-review:local
    container_name: catalog-review
    ports:
      - "8000:8000"
    environment:
      CATALOG_DB: /data/catalog.db
      MAX_CREDENTIALS: "2000"
      SECRET_KEY: "change-this-in-production"
    volumes:
      - catalog-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  catalog-data:
